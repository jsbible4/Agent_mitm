version: "3.8"

services:
  agent_b:
    build: ./agent_b
    container_name: agent_b
    ports:
      - "8001:8001"
    depends_on:
      - tool_server

  tool_server:
    build: ./tool_server
    container_name: tool_server
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro

  agent_a:
    build: ./agent_a
    container_name: agent_a
    depends_on:
      - agent_b
    environment:
      # 바꿔가며 실험: "read file", "echo hello" 등
      - PROMPT=echo hello
