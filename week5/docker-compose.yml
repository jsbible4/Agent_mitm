services:
  agent-b:
    build: ./agent_b
    container_name: agent-b
    ports:
      - "8001:8001"
    depends_on:
      - tool-server
    environment:
      - HTTP_PROXY=http://burp:8080
      - HTTPS_PROXY=http://burp:8080
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "burp:host-gateway"
      - "dockerhost:host-gateway"
    volumes:
      - ./burp.crt.pem:/usr/local/share/ca-certificates/burp.crt
      - ./server.crt:/app/server.crt
      - ./server.key:/app/server.key
    command: bash -c "update-ca-certificates 2>/dev/null; python agent_b.py"

  tool-server:
    build: ./tool_server
    container_name: tool-server
    ports:
      - "8000:8000"
    environment:
      - HTTP_PROXY=http://burp:8080
      - HTTPS_PROXY=http://burp:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "burp:host-gateway"
      - "dockerhost:host-gateway"
    volumes:
      - ./data:/data:ro
      - ./server.crt:/app/server.crt
      - ./server.key:/app/server.key
    command: bash -c "python tool_server.py"

  agent-a:
    build: ./agent_a
    container_name: agent-a
    depends_on:
      - agent-b
    environment:
      - AGENT_B_URL=https://agent-b:8001/agent
      - PROMPT=read a file
      - HTTP_PROXY=http://burp:8080
      - HTTPS_PROXY=http://burp:8080
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "burp:host-gateway"
      - "dockerhost:host-gateway"
    volumes:
      - ./burp.crt.pem:/usr/local/share/ca-certificates/burp.crt
      - ./server.crt:/app/server.crt
